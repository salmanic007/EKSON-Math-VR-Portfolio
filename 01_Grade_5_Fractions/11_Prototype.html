<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade 5 Fractions - VR Prototype Logic</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f8ff; text-align: center; padding: 50px; }
        .chocolate-bar { display: flex; justify-content: center; margin: 20px; }
        .piece { width: 50px; height: 50px; background: #8B4513; border: 2px solid #000; margin: 2px; cursor: pointer; }
        .piece.selected { background: #FFD700; }
        .options { margin-top: 30px; }
        button { padding: 10px 20px; font-size: 18px; margin: 5px; cursor: pointer; }
        #feedback { margin-top: 20px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>VR Prototype: The Chocolate Bar Challenge</h1>
    <p>Click on 2 pieces to represent 2/8, then choose the correct sum if a friend adds 3/8.</p>

    <div class="chocolate-bar" id="bar">
        <!-- 8 pieces generated by JS -->
    </div>

    <div class="options">
        <p>If you have 2/8 and your friend adds 3/8, what is the total?</p>
        <button onclick="checkAnswer('5/16')">5/16</button>
        <button onclick="checkAnswer('5/8')">5/8</button>
        <button onclick="checkAnswer('6/8')">6/8</button>
    </div>

    <div id="feedback"></div>

    <script>
        // Generate 8 chocolate pieces
        const bar = document.getElementById('bar');
        for(let i=0; i<8; i++) {
            let piece = document.createElement('div');
            piece.className = 'piece';
            piece.onclick = function() { this.classList.toggle('selected'); };
            bar.appendChild(piece);
        }

        // Check answer logic (simulating VR feedback)
        function checkAnswer(answer) {
            const feedback = document.getElementById('feedback');
            if(answer === '5/8') {
                feedback.style.color = 'green';
                feedback.innerHTML = "✅ Correct! 2/8 + 3/8 = 5/8. (VR: Show confetti & green glow)";
            } else {
                feedback.style.color = 'red';
                feedback.innerHTML = "❌ Try again. Remember, the denominator (whole bar) doesn't change! (VR: Highlight the whole bar)";
            }
        }
    </script>

</body>
</html>
